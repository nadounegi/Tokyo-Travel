<script type="text/javascript">
    $(function () {
        // ページ全体の読み込みが完了してから実行する（画像のサイズを正しく取得するため）
        $(window).on('load', function() {
            $('img.magGlass').each(function () {
                magnify(this, 2); // 2倍ズームに設定して、動作を滑らかにする
            });
        });

        function magnify(img, zoom) {
            var glass, w, h, bw;
            var isMoving = false; // 処理の連続実行を防ぐためのフラグ
            
            glass = $('<div class="img-magnifier-glass">')[0];
            $(img).before(glass);

            // 実際に描画されているサイズを取得する
            var rect = img.getBoundingClientRect();
            
            glass.style.backgroundImage = 'url("' + img.src + '")';
            glass.style.backgroundRepeat = 'no-repeat';
            // 背景画像のサイズを、実際の表示幅 × ズーム倍率に設定する
            glass.style.backgroundSize = (rect.width * zoom) + 'px ' + (rect.height * zoom) + 'px';
            
            bw = 3;
            w = glass.offsetWidth / 2;
            h = glass.offsetHeight / 2;

            glass.addEventListener('mousemove', moveMagnifier);
            img.addEventListener('mousemove', moveMagnifier);
            glass.addEventListener('touchmove', moveMagnifier);
            img.addEventListener('touchmove', moveMagnifier);

            function moveMagnifier(e) {
                e.preventDefault();
                // 連続実行中はスキップしてパフォーマンスを保つ
                if (isMoving) return;
                isMoving = true;

                // requestAnimationFrame を使用し、ブラウザが最適なタイミングで描画するようにする
                window.requestAnimationFrame(function() {
                    var pos, x, y;
                    pos = getCursorPos(e);
                    x = pos.x;
                    y = pos.y;

                    if (x > rect.width - (w / zoom)) { x = rect.width - (w / zoom); }
                    if (x < w / zoom) { x = w / zoom; }
                    if (y > rect.height - (h / zoom)) { y = rect.height - (h / zoom); }
                    if (y < h / zoom) { y = h / zoom; }

                    glass.style.left = (x - w) + 'px';
                    glass.style.top = (y - h) + 'px';
                    glass.style.backgroundPosition = '-' + ((x * zoom) - w + bw) + 'px -' + ((y * zoom) - h + bw) + 'px';
                    
                    isMoving = false; // 描画が完了したのでフラグを解除する
                });
            }

            function getCursorPos(e) {
                var a, x = 0, y = 0;
                e = e || window.event;
                a = img.getBoundingClientRect();
                x = e.pageX - a.left;
                y = e.pageY - a.top;
                x = x - window.pageXOffset;
                y = y - window.pageYOffset;
                return { x: x, y: y };
            }
        }
    });
</script>
