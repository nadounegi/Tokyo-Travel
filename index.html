<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマホ表示のためのビューポート設定（必須） -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="VpnVd8OHtRpgfqk8YcSpy0Gq00pXOavEmP3XQc7mioA" />
  <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
  <link rel="stylesheet" href="css/dior.css">
  <link rel="stylesheet" href="css/aaaa.css">
  <title>Document</title>
</head>
<body>
  <!-- 翻訳ウィジェット（1回だけ読み込み） -->
  <div class="gtranslate_wrapper"></div>
  <script>window.gtranslateSettings = { "default_language": "ja", "native_language_names": true, "wrapper_selector": ".gtranslate_wrapper", "flag_style": "3d" }</script>
  <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>

  <header>
    <div class="Trave">
      <p><img src="img/logo.png" alt="Tokyo Travel"></p>
    </div>
  </header>

  <main>
    <div id="mv">
      <!-- 左側のボックス -->
      <div id="mv-left">
        <a href="top.php" class="btn">詳しくの画面</a>
      </div>
      <!-- 右側のボックス -->
      <div id="mv-right">
        <a href="user_login.php" class="btn">ログイン</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="left"><img src="img/logo.png" width="90%" alt=""></div>
  </footer>

  <script>
    // PC画面のみマウスオーバー時のアニメーションを有効にする
    const mvLeft = document.getElementById('mv-left');
    const mvRight = document.getElementById('mv-right');

    mvLeft.addEventListener('mouseenter', () => {
      // スマホサイズ（768px以下）の時は処理しない
      if (window.innerWidth > 768) {
        mvLeft.style.width = '55%';
        mvRight.style.width = '45%';
      }
    });
    mvLeft.addEventListener('mouseleave', () => {
      if (window.innerWidth > 768) {
        mvLeft.style.width = '50%';
        mvRight.style.width = '50%';
      }
    });
    mvRight.addEventListener('mouseenter', () => {
      if (window.innerWidth > 768) {
        mvRight.style.width = '55%';
        mvLeft.style.width = '45%';
      }
    });
    mvRight.addEventListener('mouseleave', () => {
      if (window.innerWidth > 768) {
        mvRight.style.width = '50%';
        mvLeft.style.width = '50%';
      }
    });
  </script>
</body>
</html>
