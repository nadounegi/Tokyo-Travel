      <div id="mv-right">

    <script>
      const mvLeft = document.getElementById('mv-left');
      const mvRight = document.getElementById('mv-right');


      // マウスオーバー時にサイズを変更する

      mvLeft.addEventListener('mouseover', function () {
        mvLeft.style.width = '55%';
        mvRight.style.width = '45%';
      });

      mvRight.addEventListener('mouseover', function () {
        mvRight.style.width = '55%';
        mvLeft.style.width = '45%';
      });


      // マウスが外れた時に元のサイズに戻す

      mvLeft.addEventListener('mouseout', function () {
        mvLeft.style.width = '50%';
        mvRight.style.width = '50%';
      });

      mvRight.addEventListener('mouseout', function () {
        mvRight.style.width = '50%';
        mvLeft.style.width = '50%';
      });
    </script>
